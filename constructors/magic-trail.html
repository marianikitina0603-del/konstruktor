<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Конструктор шлейфа для Genially</title>
  <style>
    :root{--gold:#e4b03f;--gold2:#ffd76a;--ink:#f8f1dd;--muted:#bcb49f;--panel:#211d19;--line:#493d2c;--bg:#100e0c;--ok:#86d19a}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 75% 15%,#332617 0,transparent 35%),var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}button,input,textarea{font:inherit}
    .back{position:fixed;top:14px;right:16px;z-index:10;color:#21180b;background:var(--gold2);text-decoration:none;font-weight:800;padding:9px 12px;border-radius:11px;box-shadow:0 7px 20px #0008}
    .app{display:grid;grid-template-columns:minmax(310px,420px) 1fr;min-height:100vh}.controls{padding:28px;background:rgba(25,22,18,.96);border-right:1px solid var(--line);overflow:auto}h1{font-size:25px;line-height:1.15;margin:0 0 8px}.lead{color:var(--muted);margin:0 0 26px}.field{margin:0 0 22px}.field-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}.field label{font-weight:700}.value{color:var(--gold2);font-weight:800;font-variant-numeric:tabular-nums}textarea{width:100%;min-height:78px;resize:vertical;background:#14110f;color:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;outline:none}textarea:focus,input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(228,176,63,.14)}.hint{margin:7px 0 0;color:var(--muted);font-size:13px}input[type="range"]{width:100%;accent-color:var(--gold)}.color-row{display:grid;grid-template-columns:58px 1fr;gap:12px;align-items:center}.color-row input[type="color"]{width:58px;height:46px;padding:3px;border:1px solid var(--line);border-radius:12px;background:#14110f;cursor:pointer}.color-code{height:46px;background:#14110f;color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:0 12px;text-transform:uppercase;outline:none}.checks{display:grid;gap:10px;margin:4px 0 24px}.check{display:flex;align-items:center;gap:10px;color:var(--muted)}.check input{width:18px;height:18px;accent-color:var(--gold)}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px}.buttons button{border:0;border-radius:12px;padding:12px 14px;font-weight:800;cursor:pointer}.copy{background:linear-gradient(135deg,#ffd873,#d89b25);color:#241a0a}.download{background:#383027;color:var(--ink);border:1px solid #5b4c37!important}.status{min-height:24px;margin-top:9px;text-align:center;color:var(--ok);font-size:14px}.stage{position:relative;display:flex;align-items:center;justify-content:center;min-width:0;overflow:hidden;padding:34px}.preview{position:relative;width:min(100%,1100px);aspect-ratio:16/9;overflow:hidden;border:1px solid #6a5534;border-radius:20px;background:linear-gradient(rgba(0,0,0,.12),rgba(0,0,0,.55)),radial-gradient(circle at 72% 28%,#ad7930 0 2%,transparent 18%),linear-gradient(145deg,#6a4926,#25231d 48%,#12100e);box-shadow:0 30px 80px #000}.preview:before{content:"Ведите курсором по этому полю";position:absolute;inset:0;display:grid;place-items:center;color:rgba(255,255,255,.72);font-size:clamp(18px,2.2vw,34px);font-weight:800;pointer-events:none}#previewLayer{position:absolute;inset:0;pointer-events:none;overflow:hidden}.particle{--dx:0px;--dy:20px;--rot:100deg;position:absolute;pointer-events:none;line-height:1;font-weight:900;transform:translate(-50%,-50%);will-change:transform,opacity;animation:fade var(--life) ease-out forwards}@keyframes fade{0%{opacity:0;transform:translate(-50%,-50%) scale(.25)}18%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(15deg)}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.15) rotate(var(--rot))}}.code-title{margin-top:25px}.code{min-height:145px;font:12px/1.45 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre;color:#d8d0bf}@media(max-width:850px){.app{grid-template-columns:1fr}.controls{border-right:0;border-bottom:1px solid var(--line)}.stage{padding:18px}.preview{width:100%}}
  </style>
</head>
<body>
<a class="back" href="../index.html">← Все конструкторы</a>
<main class="app">
<section class="controls">
<h1>Конструктор волшебного шлейфа</h1><p class="lead">Настройте эффект, проверьте его справа и скопируйте готовый код в Genially.</p>
<div class="field"><div class="field-head"><label for="symbols">Частицы</label><span id="symbolCount" class="value">4</span></div><textarea id="symbols">✦ ✧ • ⋆</textarea><p class="hint">Вставляйте любые эмодзи или символы через пробел: 🍁 ✨ ⭐ 💛</p></div>
<div class="field"><div class="field-head"><label for="density">Плотность</label><span id="densityValue" class="value"></span></div><input id="density" type="range" min="1" max="10" value="6"><p class="hint">Чем выше значение, тем больше частиц появляется.</p></div>
<div class="field"><div class="field-head"><label for="speed">Скорость исчезновения</label><span id="speedValue" class="value"></span></div><input id="speed" type="range" min="300" max="1800" step="50" value="800"></div>
<div class="field"><div class="field-head"><label for="size">Размер</label><span id="sizeValue" class="value"></span></div><input id="size" type="range" min="6" max="60" value="18"></div>
<div class="field"><div class="field-head"><label for="color">Цвет частиц</label><span id="colorValue" class="value">#FFD76A</span></div><div class="color-row"><input id="color" type="color" value="#ffd76a"><input id="colorCode" class="color-code" type="text" value="#FFD76A" maxlength="7"></div></div>
<div class="checks"><label class="check"><input id="glow" type="checkbox" checked> Золотое свечение</label><label class="check"><input id="drift" type="checkbox" checked> Разлёт частиц</label></div>
<div class="buttons"><button id="copy" class="copy">Копировать код</button><button id="download" class="download">Скачать код</button></div><div id="status" class="status"></div>
<div class="field code-title"><div class="field-head"><label for="code">Готовый код</label></div><textarea id="code" class="code" readonly></textarea></div>
</section>
<section class="stage"><div id="preview" class="preview"><div id="previewLayer"></div></div></section>
</main>
<script>
(()=>{const $=id=>document.getElementById(id);const ui={symbols:$('symbols'),density:$('density'),speed:$('speed'),size:$('size'),color:$('color'),colorCode:$('colorCode'),glow:$('glow'),drift:$('drift'),code:$('code'),status:$('status')};const preview=$('preview'),layer=$('previewLayer');let last=0,statusTimer;
function particles(){const raw=ui.symbols.value.trim();if(!raw)return['✦'];const spaced=raw.split(/\s+/u).filter(Boolean);return spaced.length>1?spaced:Array.from(raw)}
function normalizeHex(v){v=String(v).trim();return/^#[0-9a-f]{6}$/i.test(v)?v.toUpperCase():null}function rgb(hex){const n=parseInt(hex.slice(1),16);return{r:(n>>16)&255,g:(n>>8)&255,b:n&255}}function mix(hex,a=.48){const {r,g,b}=rgb(hex),m=v=>Math.round(v+(255-v)*a).toString(16).padStart(2,'0');return('#'+m(r)+m(g)+m(b)).toUpperCase()}function rgba(hex,a){const {r,g,b}=rgb(hex);return`rgba(${r}, ${g}, ${b}, ${a})`}
function config(){const d=+ui.density.value,mainColor=normalizeHex(ui.color.value)||'#FFD76A';return{symbols:particles(),baseSize:+ui.size.value,sizeSpread:Math.max(2,Math.round(+ui.size.value*.4)),delay:Math.round(92-d*8),mainColor,brightColor:mix(mainColor),softColor:rgba(mainColor,.55),lifetime:+ui.speed.value,spread:ui.drift.checked?18:4,glow:ui.glow.checked,drift:ui.drift.checked}}
function labels(){const c=config();$('symbolCount').textContent=c.symbols.length;$('densityValue').textContent=ui.density.value+' / 10';$('speedValue').textContent=(c.lifetime/1000).toFixed(2).replace('.',',')+' с';$('sizeValue').textContent=c.baseSize+' px';$('colorValue').textContent=c.mainColor}
function generatedCode(){const c=config(),json=JSON.stringify(c,null,2);return `<script>\nwindow.mteConfig = ${json};\n\nif (!window.MagicTrailCoreLoaded) {\n  window.MagicTrailCoreLoaded = true;\n  var container = document.createElement("div");\n  container.id = "genially-magic-trail";\n  container.style.cssText = "position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:999999;overflow:hidden";\n  document.body.appendChild(container);\n  var style = document.createElement("style");\n  style.textContent = '.genially-magic-particle{--dx:0px;--dy:20px;--rot:100deg;position:absolute;pointer-events:none;line-height:1;font-weight:900;transform:translate(-50%,-50%);will-change:transform,opacity;animation:mteFade var(--life) ease-out forwards}@keyframes mteFade{0%{opacity:0;transform:translate(-50%,-50%) scale(.25)}18%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(15deg)}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.15) rotate(var(--rot))}}';\n  document.head.appendChild(style);\n  var lastTime = 0;\n  document.addEventListener("mousemove", function(e) {\n    var cfg = window.mteConfig; if (!cfg || cfg.active === false) return;\n    var now = performance.now(); if (now-lastTime < cfg.delay) return; lastTime=now;\n    var fsTarget=document.fullscreenElement||document.webkitFullscreenElement||document.body; if(container.parentNode!==fsTarget) fsTarget.appendChild(container);\n    var p=document.createElement("span"); p.className="genially-magic-particle"; p.textContent=cfg.symbols[Math.floor(Math.random()*cfg.symbols.length)];\n    var size=cfg.baseSize+Math.random()*cfg.sizeSpread; p.style.left=(e.clientX+(Math.random()-.5)*cfg.spread)+"px"; p.style.top=(e.clientY+(Math.random()-.5)*cfg.spread)+"px"; p.style.fontSize=size+"px"; p.style.color=Math.random()>.3?cfg.mainColor:cfg.brightColor; p.style.textShadow=cfg.glow?"0 0 4px "+cfg.brightColor+",0 0 9px "+cfg.mainColor+",0 0 18px "+cfg.softColor:"none"; p.style.setProperty("--dx",cfg.drift?((Math.random()-.5)*28)+"px":"0px"); p.style.setProperty("--dy",cfg.drift?(12+Math.random()*25)+"px":"4px"); p.style.setProperty("--rot",(Math.random()*180-90)+"deg"); p.style.setProperty("--life",cfg.lifetime+"ms"); container.appendChild(p); setTimeout(function(){p.remove()},cfg.lifetime+60);\n  }, {passive:true});\n}\n<\/script>`}
function refresh(){labels();ui.code.value=generatedCode()}function spawn(x,y){const c=config(),p=document.createElement('span');p.className='particle';p.textContent=c.symbols[Math.floor(Math.random()*c.symbols.length)];p.style.left=x+(Math.random()-.5)*c.spread+'px';p.style.top=y+(Math.random()-.5)*c.spread+'px';p.style.fontSize=c.baseSize+Math.random()*c.sizeSpread+'px';p.style.color=Math.random()>.3?c.mainColor:c.brightColor;p.style.textShadow=c.glow?`0 0 4px ${c.brightColor},0 0 9px ${c.mainColor},0 0 18px ${c.softColor}`:'none';p.style.setProperty('--dx',c.drift?(Math.random()-.5)*28+'px':'0px');p.style.setProperty('--dy',c.drift?12+Math.random()*25+'px':'4px');p.style.setProperty('--rot',Math.random()*180-90+'deg');p.style.setProperty('--life',c.lifetime+'ms');layer.appendChild(p);setTimeout(()=>p.remove(),c.lifetime+60)}
preview.addEventListener('pointermove',e=>{const c=config(),now=performance.now();if(now-last<c.delay)return;last=now;const r=preview.getBoundingClientRect();spawn(e.clientX-r.left,e.clientY-r.top)});ui.color.addEventListener('input',()=>{ui.colorCode.value=ui.color.value.toUpperCase();refresh()});ui.colorCode.addEventListener('input',()=>{const h=normalizeHex(ui.colorCode.value);if(h){ui.color.value=h;refresh()}});document.querySelectorAll('input,textarea').forEach(el=>{if(el!==ui.color&&el!==ui.colorCode)el.addEventListener('input',refresh)});function msg(t){clearTimeout(statusTimer);ui.status.textContent=t;statusTimer=setTimeout(()=>ui.status.textContent='',2200)}$('copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(ui.code.value);msg('Код скопирован')}catch{ui.code.select();document.execCommand('copy');msg('Код скопирован')}});$('download').addEventListener('click',()=>{const blob=new Blob([ui.code.value],{type:'text/html;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='shleif-dlya-genially.html';a.click();URL.revokeObjectURL(a.href);msg('Файл скачан')});refresh()})();
</script>
</body>
</html>
